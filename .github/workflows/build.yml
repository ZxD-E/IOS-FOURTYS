name: FourTysLauncher
options:
  bundleIdPrefix: com.fourtys
  deploymentTarget:
    iOS: "18.7.10"
targets:
  FourTysLauncher:
    type: application
    platform: iOS
    sources:
      - path: Source
        excludes:
          - Main/Info.plist
    dependencies:
      - sdk: QuartzCore.framework
    info:
      path: Source/Main/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourtys.roleplay.client
        PRODUCT_NAME: FourTysLauncher
        INFOPLIST_FILE: Source/Main/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        OTHER_LDFLAGS: "$(inherited) -lc++"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
